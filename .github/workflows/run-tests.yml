name: 'Run tests'

on:
  push:
    branches: ['main', 'develop']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Run tests
        run: npm run test:coverage

      - name: 'Upload Coverage'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
